# MCHOSE V9 Pro 2: lower ALSA buffering for "Microphone monitoring" (optional).
# USB audio is a "batch" device: PipeWire then keeps an extra period of headroom on each side.
# With batch handling off and small periods, monitoring gets close to the quantum the app asks
# for (64 samples = 1.3 ms). If you hear crackles, raise period-size to 128/256 or remove this file.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-bestechnic_MCHOSE_V9_Pro_2.*" }
      { node.name = "~alsa_output.usb-bestechnic_MCHOSE_V9_Pro_2.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-batch = true
        api.alsa.period-size   = 64
        api.alsa.headroom      = 0
      }
    }
  }
]
