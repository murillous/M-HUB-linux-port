# MCHOSE V9 Pro 2: o firmware anuncia o PCM como -50..0 dB em 50 passos, mas a curva real
# não bate, então quase todo o volume fica nos primeiros 15-20% do controle.
# Volume passa a ser feito pelo PipeWire (software); o mixer do headset fica em 100%.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-bestechnic_MCHOSE_V9_Pro_2.*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
